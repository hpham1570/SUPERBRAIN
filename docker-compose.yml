version: '3.8'

services:
  superbrain-app:
    build: .
    container_name: superbrain-10x-engine
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/app/workspace
    restart: always
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  redis:
    image: redis:7-alpine
    container_name: superbrain-redis-hub
    ports:
      - "6379:6379"
    restart: always
